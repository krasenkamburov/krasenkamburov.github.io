name: Build Sedem piesi v2 with accessible contents
# Refinement: one-page seven-play contents, all chapter links retained
on:
  push:
    branches: [prepare-krasenkamburov-migration]
    paths:
      - '.github/workflows/build-sedem-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install book production libraries
        run: python -m pip install 'pymupdf==1.26.7' lxml
      - name: Build PDF EPUB and web TOC
        run: python scripts/build_sedem_v2.py
      - name: Commit final edition files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/sedem-piesi/sedem-piesi-v2.pdf books/sedem-piesi/sedem-piesi-v2.epub books/sedem-piesi/sadarzhanie.html scripts/sedem_v2_report.json
          git diff --cached --quiet && exit 1
          git commit -m "Build accessible Sedem piesi v2 edition with new covers"
          git push
