name: Audit Sedem piesi structure
on:
  push:
    branches: [prepare-krasenkamburov-migration]
    paths:
      - '.github/workflows/audit-sedem-piesi.yml'
      - 'scripts/sedem_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pymupdf lxml
      - run: python scripts/sedem_audit.py
      - name: Save structure report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sedem_audit_report.json
          git diff --cached --quiet || (git commit -m "Audit Sedem piesi structure for accessible edition" && git push)
